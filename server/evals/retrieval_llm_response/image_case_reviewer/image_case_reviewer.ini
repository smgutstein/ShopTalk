# ShopTalk image-case reviewer configuration.
#
# Paths may be absolute, but repository-relative paths are recommended because
# they remain valid when the project is moved to another machine.

[paths]
# The original hand-authored case file. This utility validates but never edits it.
source_cases = server/evals/retrieval_llm_response/cases/eval_cases_retrieval_llm_text_plus_image_45.jsonl

# The editable copy. It is created from the validated source on the first run.
working_cases = server/evals/retrieval_llm_response/cases/eval_cases_retrieval_llm_text_plus_image_45_with_images.jsonl

# Selected images are stored here using the case ID as the filename.
image_dir = server/evals/retrieval_llm_response/query_images

# Search-result source information is kept outside the strict eval-case JSONL.
provenance_file = server/evals/retrieval_llm_response/query_images/image_sources.json

[search]
max_results = 12
region = us-en
safesearch = moderate

[download]
max_download_mb = 25
request_timeout_seconds = 30
jpeg_quality = 95

[server]
# Host default. The launcher overrides this to 0.0.0.0 inside Docker.
server_name = 127.0.0.1

# The normal ShopTalk Gradio UI uses 7860, so this utility defaults to 7861.
server_port = 7861
share = false
