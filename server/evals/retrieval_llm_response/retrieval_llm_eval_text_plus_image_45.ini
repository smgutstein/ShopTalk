# Configuration for the human-in-the-loop ShopTalk retrieval/LLM evaluation.
#
# The generator and scorer both read this file, so the normal commands stay short:
#
#   python -m server.evals.generate_retrieval_llm_judgments --config server/evals/retrieval_llm_response/retrieval_llm_eval.ini
#   python -m server.evals.score_retrieval_llm_judgments --config server/evals/retrieval_llm_response/retrieval_llm_eval.ini
#
# Generation writes an immutable numbered JSON under [eval] output_dir and an
# identically numbered editable copy under [eval] reviewed_output_dir. Edit only
# the reviewed copy. Scoring automatically selects the newest reviewed copy.

[eval]
cases = server/evals/retrieval_llm_response/cases/eval_cases_retrieval_llm_text_plus_image_45_with_images.jsonl
# Use "none" to run all cases.
limit = none
# Use "auto" to create the next numbered judgment file in output_dir.
output = auto
output_dir = server/evals/retrieval_llm_response/generated
reviewed_output_dir = server/evals/retrieval_llm_response/reviewed
output_prefix = retrieval_llm_text_plus_image_45_judgments
# Print case-by-case progress so long eval runs do not look hung.
progress = true
# Pause between cases to avoid hammering the LLM API. Use 0.0 for no pause.
sleep_seconds_between_cases = 0.1
# Retry likely API rate-limit failures before aborting the whole eval run.
max_retries = 3
retry_sleep_seconds = 5.0

[runtime]
personality = 0
debug = false
cpu = false
# This is the normal ShopTalk app/model config, not this eval config.
shoptalk_config = shoptalk_config.ini
# Use "config" to inherit the eval model defaults from shoptalk_config.ini.
model = config
temperature = config

[artifacts]
vector_db_output_dir = artifacts/vector_db
vector_backend = faiss
top_k = 5
product_blurbs = EDA/product_blurbs/combined_blurb_dict.json
images_csv = images.csv

[score]
# Use "auto" to score the newest numbered file in reviewed_output_dir.
judgments = auto
# Use "auto" to derive the report name from the reviewed judgment file.
output = auto
output_dir = server/evals/retrieval_llm_response/results
output_prefix = retrieval_llm_metrics
allow_unjudged = false
