# Complete configuration for the pre-retrieval search-decision evaluation.
# Run with:
#
#   ./run_eval_search_decision.sh
#
# To reproduce a different evaluation, copy this file, edit the copy, and pass:
#
#   ./run_eval_search_decision.sh --config path/to/copied_config.ini

[model]
model_name = gpt-4o
temperature = 0.0

[eval]
cases = server/evals/search_decision/cases/eval_cases_search_decision.jsonl
# Use "none" to evaluate every selected case.
limit = none
# Comma-separated category names. Leave blank to include all categories.
categories =

[output]
output_dir = server/evals/search_decision/results
output_prefix = search_decision_eval
# Use "all" or "failures".
detail_level = all
