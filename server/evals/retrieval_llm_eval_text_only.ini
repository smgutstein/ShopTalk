# Configuration for the human-in-the-loop ShopTalk retrieval/LLM evaluation.
#
# The generator and scorer both read this file, so the normal commands stay short:
#
#   python -m server.evals.generate_retrieval_llm_judgments --config server/evals/retrieval_llm_eval.ini
#   python -m server.evals.score_retrieval_llm_judgments --config server/evals/retrieval_llm_eval.ini
#
# The first command writes a judgment file under [eval] output_dir. After you
# hand-edit that file, set [score] judgments to the reviewed file you want scored.

[eval]
cases = server/evals/eval_cases_retrieval_llm_text_only_10_5.jsonl
# Use "none" to run all cases.
limit = none
# Use "auto" to create the next numbered judgment file in output_dir.
output = auto
output_dir = server/evals/eval_results
output_prefix = retrieval_llm_text_only_judgments
# Print case-by-case progress so long eval runs do not look hung.
progress = true
# Pause between cases to avoid hammering the LLM API. Use 0.0 for no pause.
sleep_seconds_between_cases = 0.1
# Retry likely API rate-limit failures before aborting the whole eval run.
max_retries = 3
retry_sleep_seconds = 5.0

[runtime]
personality = 0
debug = false
cpu = false
# This is the normal ShopTalk app/model config, not this eval config.
shoptalk_config = shoptalk_config.ini
# Use "config" to inherit the eval model defaults from shoptalk_config.ini.
model = config
temperature = config

[artifacts]
vector_db_output_dir = artifacts/vector_db
vector_backend = faiss
top_k = 5
product_blurbs = EDA/product_blurbs/combined_blurb_dict.json
images_csv = images.csv

[score]
# Use "required" until you have generated/reviewed a judgment file, then
# replace it with that JSON path.
judgments = server/evals/eval_results/retrieval_llm_text_only_judgments_001_reviewed.json
# Use "auto" to create the next numbered metrics report in output_dir.
output = auto
output_dir = server/evals/eval_results
output_prefix = retrieval_llm_metrics
allow_unjudged = false
