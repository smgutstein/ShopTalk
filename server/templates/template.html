<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ShopTalk</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
      function submitInput() {
        var userInput = document.getElementById('user_input').value;
        document.getElementById('spinner').style.display = 'inline-block';
        document.getElementById('user_input').disabled = true;
        fetch('/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ user_input: userInput }),
        })
        .then(response => response.json())
        .then(data => {
          document.getElementById('conversation').innerHTML = data.conversation.map(message => {
            if (message.type === "HumanMessage") {
              return `<strong>User:</strong> ${message.content}<br>`;
            } else if (message.type === "AIMessage") {
              return `<strong>${data.personality}:</strong> ${message.content}<br>`;
            }
          }).join('');
          document.getElementById('user_input').value = '';
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('user_input').disabled = false;
          document.getElementById('user_input').focus();
          const conversationDiv = document.getElementById('conversation');
          conversationDiv.scrollTop = conversationDiv.scrollHeight;
          document.getElementById('image_results').innerHTML = data.chosen_product ? `
            <div class="text-center my-4">
              <p>Product Type: ${data.chosen_product.product_type}</p>
              <div id="productCarousel" class="carousel slide" data-ride="carousel">
                <ol class="carousel-indicators">
                  ${data.chosen_product.image_paths.map((_, index) => `
                    <li data-target="#productCarousel" data-slide-to="${index}" class="${index === 0 ? 'active' : ''}"></li>
                  `).join('')}
                </ol>
                <div class="carousel-inner text-center">
                  ${data.chosen_product.image_paths.map((image, index) => `
                    <div class="carousel-item ${index === 0 ? 'active' : ''}">
                      <img src="static/images/${image}/" class="d-block w-100" alt="${image}">
                    </div>
                  `).join('')}
                </div>
                <a class="carousel-control-prev" href="#productCarousel" role="button" data-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" href="#productCarousel" role="button" data-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="sr-only">Next</span>
                </a>
              </div>
              <p>Similarity Score: ${data.chosen_product.score.toFixed(2)}</p>
              <i class="fas fa-thumbs-up ml-2"></i> <i class="fas fa-thumbs-down ml-1"></i>
            </div>
            <hr>
          ` : '';
          document.getElementById('user_input').value = '';
        });
      }
    </script>
    <style>
      .carousel-item img {
        max-width: 300px;
        margin: 0 auto;
      }
      .carousel-control-prev-icon,
      .carousel-control-next-icon {
        background-color: black;
        border-radius: 50%;
      }
      .carousel {
        display: flex;
        justify-content: center;
        max-width: 320px;
        margin: 0 auto;
        height: 350px;
      }
      .carousel-inner {
        height: 100%;
        display: flex;
        align-items: center;
      }
      .carousel-item {
        height: 100%;
      }
      .carousel-control-prev,
      .carousel-control-next {
        width: 30px;
      }
      .carousel-indicators li {
        background-color: black;
      }
      .carousel-indicators .active {
        background-color: red;
      }
      #conversation {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 10px;
      }
      .spinner-border {
        width: 1.5rem;
        height: 1.5rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="container">
        <h1 class="my-4 text-center">ShopTalk</h1>
        <div class="row">
          <div class="col-md-8">
            <div id="conversation" class="mb-4">
              {% for message in conversation_history %}
                <div class="message">
                  {% if message.type == "human" %}
                    <strong>User:</strong> {{ message.content }}
                  {% elif message.type == "ai" %}
                    <strong>{{personality}}:</strong> {{ message.content }}
                  {% endif %}
                </div>
              {% endfor %}
            </div>
            <form onsubmit="event.preventDefault(); submitInput();" class="mb-4">
              <div class="input-group">
                <input type="text" id="user_input" name="user_input" class="form-control" placeholder="Type your message here...">
                <div class="input-group-append">
                  <button type="button" class="btn btn-primary" onclick="submitInput()">Submit</button>
                  <div id="spinner" class="spinner-border text-primary ml-2" role="status">
                    <span class="sr-only">Loading...</span>
                  </div>
                </div>
              </div>
            </form>
            <div id="follow_up_input" style="display:none;">
              <h2>Follow-up Prompt:</h2>
              <p id="follow_up_prompt"></p>
              <label for="follow_up">Your response:</label><br>
              <input type="text" id="follow_up" name="follow_up" class="form-control"><br><br>
              <button class="btn btn-primary" onclick="submitInput()">Submit</button>
            </div>
          </div>
          <div class="col-md-4">
            <div id="image_results"></div>
          </div>
        </div>
      </div>
  </body>
</html>
